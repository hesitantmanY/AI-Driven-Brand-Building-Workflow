body{background:#faf8f4;color:#222;font:16px system-ui;padding:24px}section{padding:24px;border:1px solid #bbb;margin-bottom:20px}.row{display:flex;flex-wrap:wrap;gap:16px}button{position:relative;background:#222;color:#faf8f4;border:1px solid #222;border-radius:0;padding:12px 18px;font:14px ui-monospace,monospace;cursor:pointer}.ghost{background:transparent;color:#222;border-color:#aaa}.danger{background:transparent;color:#7b2f24;border-color:#7b2f24}button:focus-visible{outline:2px solid #2c5fb3;outline-offset:3px}button:disabled{opacity:.4;cursor:not-allowed}.a button:not(:disabled):hover{transform:translateY(-2px)}.a button:not(:disabled):hover:after{content:'';position:absolute;height:2px;background:#6b2e1a;bottom:0;left:0;right:0}.a button:active{transform:none}.b button:not(:disabled):hover{outline:1px solid currentColor;outline-offset:2px}.b button:not(:disabled):active{box-shadow:inset 0 0 0 2px #999}.c button{background:transparent;color:#222}.c button:not(:disabled):hover{background:#222;color:#faf8f4}.c button:not(:disabled):active{transform:scale(.98)}.selected{background:#222!important;color:#faf8f4!important}
</style><h1>按钮方向对比 · 规格原型</h1><p>用鼠标 hover、Tab 聚焦或按下比较。每组依次为主操作、次操作、删除、当前选中、生成中、禁用；仅演示外观，无业务动作。</p><section class="a"><h2>A · 当前通用方向</h2><p>黑底主操作；hover 上移与强调底线；按下回落。</p><div class="row"><button>AI 起草</button><button class="ghost">添加候选</button><button class="danger" aria-label="删除候选市场：华东">删除华东</button><button class="selected" aria-pressed="true">API 自动</button><button>生成中 · 中止</button><button disabled>不可用</button></div></section><section class="b"><h2>B · 保留黑白层级，状态反馈稳定</h2><p>主操作黑底，次操作纸底；hover 描边，focus 蓝色轮廓，按下内描边。危险操作始终有文字与危险色，无位移动效。</p><div class="row"><button>AI 起草</button><button class="ghost">添加候选</button><button class="danger" aria-label="删除候选市场：华东">删除华东</button><button class="selected" aria-pressed="true">API 自动</button><button>生成中 · 中止</button><button disabled>不可用</button></div></section><section class="c"><h2>C · design.md 纸底方向</h2><p>纸底按钮；hover 反色；按下缩放。选中态保持黑底。</p><div class="row"><button>AI 起草</button><button class="ghost">添加候选</button><button class="danger" aria-label="删除候选市场：华东">删除华东</button><button class="selected" aria-pressed="true">API 自动</button><button>生成中 · 中止</button><button disabled>不可用</button></div></section></html>
